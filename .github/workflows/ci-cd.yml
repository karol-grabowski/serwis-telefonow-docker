name: CI/CD Pipeline - Build Docker Image

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie kodu z repozytorium
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Logowanie do Docker Huba
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Konfiguracja budowania obrazów
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Budowanie i wysyłanie obrazu do Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/serwis-telefonow:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/serwis-telefonow:${{ github.sha }}
